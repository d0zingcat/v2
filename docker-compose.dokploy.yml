name: miniflux

services:
  miniflux:
    build:
      context: .
      dockerfile: packaging/docker/alpine/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-miniflux}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}@db:5432/${POSTGRES_DB:-miniflux}?sslmode=disable
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      CREATE_ADMIN: "${CREATE_ADMIN:-1}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in Dokploy}"
      BASE_URL: "${BASE_URL:-}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-miniflux}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}"
      POSTGRES_DB: "${POSTGRES_DB:-miniflux}"
    volumes:
      - miniflux-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniflux} -d ${POSTGRES_DB:-miniflux}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  miniflux-postgres-data:
